# Render Blueprint — https://render.com/docs/blueprint-spec
# 배포는 GitHub Actions(.github/workflows/deploy.yml)가 Deploy Hook으로 트리거한다.
services:
  - type: web
    name: hackathon-kt-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        value: https://hackathon-kt.vercel.app,http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        value: https://hackathon-[a-z0-9-]+-ktc-kiju-kang\.vercel\.app
      # 비밀값: Render 대시보드에서 입력
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_EFFORT
        value: medium
