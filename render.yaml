# Render Blueprint — https://render.com/docs/blueprint-spec
# 최초 1회: Render 대시보드 > New > Blueprint > 이 레포 선택. 이후 main 머지 + CI 통과 시 자동 배포.
services:
  - type: web
    name: hackathon-kt-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        value: https://kiju-kang.github.io,http://localhost:5173
