# Dependabot — 의존성 업데이트와 취약점 알림. 3명 팀이 PR 더미에 묻히지 않도록 주 1회·그룹으로 시작한다.
# - 메이저 업데이트는 호환성 검토가 필요해 버전 업데이트에서 제외한다 (보안 업데이트는 별개로 계속 온다).
# - 커밋 메시지는 팀 규칙 `<type>(<feature>): 요약` 을 따른다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
