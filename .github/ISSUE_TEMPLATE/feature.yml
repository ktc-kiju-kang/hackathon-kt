name: 기능 (REQ)
description: 요구사항 하나 = Issue 하나 (frontend + backend + 시험까지 한 사람이 담당). 제목은 [REQ-01] <요약>
title: "[REQ-] "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 사용자가 무엇을 할 수 있게 되는가 (docs/prd.md의 REQ 문장)
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건 (AC)
      description: 관찰 가능한 결과로 — 정상·오류·권한 경계 각각
      value: |
        - [ ] AC-01-1 
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 연결 문서
      value: |
        - 요구사항: docs/prd.md REQ-
        - 시험: docs/e2e-test.md TC-
        - 계약: docs/contracts/<feature>.md
  - type: textarea
    id: evidence
    attributes:
      label: 구현·검증 근거 (작업 후, make ship이 댓글로 남김)
      description: 커밋 주소, 시험 명령·결과
