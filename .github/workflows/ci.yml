name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # uv 로 설치한다 (pip 보다 빠르고 로컬 명령과 같다). Render 운영 빌드는 pip 그대로.
      - run: pip install uv
      - run: uv venv && uv pip install -r requirements-dev.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ty check app tests evals
      - run: .venv/bin/pytest
  # 본선 시작 키트가 이 레포의 변경으로 깨지지 않는지 (templates/starter/README.md)
  starter-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 templates/starter/export.py "$RUNNER_TEMP/kit"
      - working-directory: ${{ runner.temp }}/kit/backend
        run: |
          python -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/ruff check . && .venv/bin/ruff format --check .
          .venv/bin/ty check app tests
          .venv/bin/pytest -q
      - run: python3 "$RUNNER_TEMP/kit/scripts/check-docs.py" --draft "$RUNNER_TEMP/kit"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - working-directory: ${{ runner.temp }}/kit/frontend
        run: npm ci && npm run lint && npm test && npm run build
