name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    # PostgreSQL (compose.yaml의 db와 같은 계정·호스트 포트 55432 — backend 기본 DATABASE_URL 그대로)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ty check app tests
      - run: .venv/bin/pytest
  # 로컬 배포 파이프라인 그대로: 설치 → 격리 배포 → E2E (docs/pipeline.md). 결과 기록은 로컬 make e2e로 커밋한다.
  e2e:
    runs-on: ubuntu-latest
    # PostgreSQL (compose.yaml의 db와 같은 계정·호스트 포트 55432 — backend 기본 DATABASE_URL 그대로)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: make setup
      - run: make e2e
  # 시작 키트가 이 레포의 변경으로 깨지지 않는지: 내보낸 키트(팀 레포와 같은 상태)에서 파이프라인 그대로
  starter-kit:
    runs-on: ubuntu-latest
    # PostgreSQL (compose.yaml의 db와 같은 계정·호스트 포트 55432 — backend 기본 DATABASE_URL 그대로)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: python3 templates/starter/export.py "$RUNNER_TEMP/kit"
      - working-directory: ${{ runner.temp }}/kit
        run: |
          git init -q -b main && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm kit
          make setup
          make verify
          make e2e
