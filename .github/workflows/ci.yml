name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # uv 로 설치한다 (pip 보다 빠르고 로컬 명령과 같다). Render 운영 빌드는 pip 그대로.
      - run: pip install uv
      - run: uv venv && uv pip install -r requirements-dev.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ty check app tests evals
      - run: .venv/bin/pytest
  # 본선 시작 키트가 이 레포의 변경으로 깨지지 않는지 (templates/starter/README.md)
  starter-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: python3 templates/starter/export.py "$RUNNER_TEMP/kit"
      # 배정 레포처럼 git 저장소로 만든 뒤 파이프라인을 그대로 돌린다 (설치 → 검사 → 격리 배포 E2E)
      - working-directory: ${{ runner.temp }}/kit
        run: |
          git init -q -b main && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm kit
          make setup
          make verify
          make e2e
